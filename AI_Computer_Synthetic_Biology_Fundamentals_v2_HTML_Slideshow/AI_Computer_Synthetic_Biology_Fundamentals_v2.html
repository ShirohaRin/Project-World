  <script>
    (() => {
      const slides = [...document.querySelectorAll('.slide')];
      const counter = document.getElementById('counter');
      let current = 0;
      function go(to) {
        current = Math.max(0, Math.min(slides.length - 1, to));
        slides.forEach((slide, i) => slide.classList.toggle('active', i === current));
        counter.textContent = `${current + 1} / ${slides.length}`;
      }
      document.getElementById('stage').addEventListener('click', () => go(current + 1));
      window.addEventListener('keydown', (event) => {
        if (['ArrowRight', 'ArrowDown', ' ', 'Enter', 'PageDown'].includes(event.key)) { event.preventDefault(); go(current + 1); }
        if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); go(current - 1); }
        if (event.key === 'Home') go(0);
        if (event.key === 'End') go(slides.length - 1);
        if (event.key.toLowerCase() === 'f' || event.key === 'F11') { event.preventDefault(); document.documentElement.requestFullscreen?.(); }
      });
    })();
  </script>
