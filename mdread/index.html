<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>MD Reader</title>
  <style>
    :root { --bg:#f6f7f9; --panel:#ffffff; --text:#1d2430; --muted:#687386; --line:#dfe3e9; --accent:#1976d2; --code:#f0f2f5; --shadow:0 8px 24px rgba(30,40,55,.08); }
    :root[data-theme="dark"] { --bg:#15191f; --panel:#20262e; --text:#e8edf4; --muted:#aab5c4; --line:#39424e; --accent:#6eaeff; --code:#171c22; --shadow:none; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; background:transparent; border:0; cursor:pointer; }
    .app { min-height:100vh; display:grid; grid-template-columns:268px minmax(0,1fr); }
    aside { border-right:1px solid var(--line); background:var(--panel); padding:18px 14px; display:flex; flex-direction:column; gap:14px; }
    .brand { display:flex; align-items:center; gap:10px; padding:0 6px; font-weight:700; font-size:17px; }
    .mark { width:28px; height:28px; display:grid; place-items:center; background:var(--accent); color:white; border-radius:6px; font-size:13px; }
    .file-button { background:var(--accent); color:#fff; border-radius:5px; padding:9px 12px; text-align:center; font-weight:600; }
    .search { width:100%; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:8px 10px; outline:none; }
    .search:focus { border-color:var(--accent); }
    .toc-label { color:var(--muted); font-size:12px; font-weight:700; padding:0 6px; }
    #toc { overflow:auto; flex:1; }
    .toc-item { width:100%; display:block; padding:5px 6px; text-align:left; color:var(--muted); border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .toc-item:hover,.toc-item.active { background:var(--bg); color:var(--accent); }
    .toc-2 { padding-left:18px; }.toc-3 { padding-left:30px; }.toc-4,.toc-5,.toc-6 { padding-left:42px; }
    main { min-width:0; }
    header { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 28px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--panel) 92%,transparent); position:sticky; top:0; z-index:2; backdrop-filter:blur(10px); }
    #filename { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tools { display:flex; gap:4px; align-items:center; }
    .tools button { min-width:34px; height:34px; padding:0 8px; border-radius:4px; }
    .tools button:hover { background:var(--bg); }
    .reader { max-width:960px; margin:0 auto; padding:44px clamp(22px,5vw,70px) 80px; font-size:var(--font-size,17px); }
    .empty { min-height:65vh; display:grid; place-items:center; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:8px; padding:32px; }
    .empty strong { color:var(--text); font-size:20px; display:block; margin-bottom:8px; }
    article { word-break:break-word; }
    article h1,article h2,article h3 { line-height:1.25; scroll-margin-top:84px; }
    article h1 { font-size:2em; margin:0 0 1em; border-bottom:1px solid var(--line); padding-bottom:.45em; }
    article h2 { font-size:1.5em; margin-top:1.9em; border-bottom:1px solid var(--line); padding-bottom:.35em; }
    article h3 { font-size:1.22em; margin-top:1.5em; }
    article p,article li { margin:.75em 0; }
    article a { color:var(--accent); }
    article blockquote { margin:1em 0; padding:.2em 1em; color:var(--muted); border-left:4px solid var(--accent); background:color-mix(in srgb,var(--accent) 6%,transparent); }
    article pre { overflow:auto; padding:14px; background:var(--code); border:1px solid var(--line); border-radius:5px; }
    article code { font-family:Consolas,"Cascadia Code",monospace; background:var(--code); padding:.12em .3em; border-radius:3px; font-size:.88em; }
    article pre code { padding:0; background:transparent; }
    article table { width:100%; border-collapse:collapse; margin:1em 0; overflow:hidden; display:block; overflow-x:auto; }
    article th,article td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
    article th { background:var(--code); }
    article img { max-width:100%; height:auto; }
    article hr { border:0; border-top:1px solid var(--line); margin:2em 0; }
    kbd { border:1px solid var(--line); padding:1px 5px; border-radius:3px; background:var(--code); }
    #drop { position:fixed; inset:0; z-index:10; display:none; place-items:center; background:rgba(25,118,210,.18); border:4px dashed var(--accent); color:var(--accent); font-size:20px; font-weight:700; }
    #drop.show { display:grid; }
    @media (max-width:720px) { .app { grid-template-columns:1fr; } aside { display:none; } header { padding:0 14px; } .reader { padding-top:28px; } }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><span class="mark">MD</span> Markdown Reader</div>
      <label class="file-button" for="file">打开 Markdown 文件</label>
      <input id="file" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
      <input id="search" class="search" type="search" placeholder="搜索本文..." />
      <div class="toc-label">文档目录</div><nav id="toc"><span class="toc-item">打开文档后显示目录</span></nav>
    </aside>
    <main>
      <header><div id="filename">未打开文档</div><div class="tools"><button id="decrease" title="缩小字号">A−</button><button id="increase" title="放大字号">A+</button><button id="theme" title="切换主题">主题</button><button id="copy" title="复制纯文本">复制</button><button id="export" title="导出 HTML">导出</button></div></header>
      <div class="reader"><article id="content"><div class="empty"><div><strong>打开一个 Markdown 文件</strong>点击左侧按钮，或将文件拖进此页面。<br />支持标题、列表、链接、表格、代码块和图片。</div></div></article></div>
    </main>
  </div>
  <div id="drop">松开以打开 Markdown 文件</div>
  <script>
    const content = document.querySelector('#content'), toc = document.querySelector('#toc'), fileInput = document.querySelector('#file');
    const filename = document.querySelector('#filename'), search = document.querySelector('#search'), drop = document.querySelector('#drop');
    let raw = '', fontSize = 17;
    const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const inline = (s) => escapeHtml(s).replace(/!\[([^\]]*)\]\(([^ )]+)(?:\s+"[^"]*")?\)/g,'<img alt="$1" src="$2">').replace(/\[([^\]]+)\]\(([^ )]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>').replace(/(?<!_)_([^_]+)_(?!_)/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');
    function render(md) {
      const lines = md.replace(/\r\n?/g,'\n').split('\n'); let html='', i=0, inCode=false, code=[], list=null;
      const closeList=()=>{if(list){html += `</${list}>`;list=null;}};
      while(i<lines.length){const l=lines[i];
        if(/^```/.test(l)){closeList(); if(inCode){html+=`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;code=[];} inCode=!inCode; i++;continue;}
        if(inCode){code.push(l);i++;continue;}
        if(/^\|.*\|\s*$/.test(l) && i+1<lines.length && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(lines[i+1])){closeList();const heads=l.trim().slice(1,-1).split('|'); html+='<table><thead><tr>'+heads.map(x=>'<th>'+inline(x.trim())+'</th>').join('')+'</tr></thead><tbody>';i+=2;while(i<lines.length&&/^\|.*\|\s*$/.test(lines[i])){html+='<tr>'+lines[i].trim().slice(1,-1).split('|').map(x=>'<td>'+inline(x.trim())+'</td>').join('')+'</tr>';i++;}html+='</tbody></table>';continue;}
        const h=l.match(/^(#{1,6})\s+(.+)$/); if(h){closeList(); const id='h-'+i;html+=`<h${h[1].length} id="${id}">${inline(h[2])}</h${h[1].length}>`;i++;continue;}
        if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(l)){closeList();html+='<hr>';i++;continue;}
        if(/^>\s?/.test(l)){closeList();let q=[];while(i<lines.length&&/^>\s?/.test(lines[i]))q.push(lines[i++].replace(/^>\s?/,''));html+='<blockquote>'+inline(q.join('<br>'))+'</blockquote>';continue;}
        const li=l.match(/^\s*([-+*]|\d+\.)\s+(.+)$/);if(li){const tag=/\d+\./.test(li[1])?'ol':'ul';if(list!==tag){closeList();html+='<'+tag+'>';list=tag;}html+='<li>'+inline(li[2])+'</li>';i++;continue;}
        closeList(); if(!l.trim()){i++;continue;} html+='<p>'+inline(l)+'</p>';i++;
      } closeList(); content.innerHTML=html || '<div class="empty">此文件没有可显示内容。</div>'; buildToc();
    }
    function buildToc(){const headings=[...content.querySelectorAll('h1,h2,h3,h4,h5,h6')];toc.innerHTML=headings.length?'':'';headings.forEach(h=>{const b=document.createElement('button');b.className='toc-item toc-'+h.tagName.slice(1);b.textContent=h.textContent;b.onclick=()=>h.scrollIntoView({behavior:'smooth'});toc.appendChild(b)});if(!headings.length)toc.innerHTML='<span class="toc-item">此文档没有标题</span>';}
    function openFile(f){if(!f)return;const reader=new FileReader();reader.onload=()=>{raw=String(reader.result);filename.textContent=f.name;render(raw);search.value='';};reader.readAsText(f,'UTF-8');}
    fileInput.onchange=e=>openFile(e.target.files[0]);
    search.oninput=()=>{if(!raw)return;const q=search.value.trim();render(raw);if(q){const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');content.innerHTML=content.innerHTML.replace(re,m=>`<mark>${m}</mark>`);}};
    document.querySelector('#theme').onclick=()=>{const root=document.documentElement;root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';};
    document.querySelector('#increase').onclick=()=>{fontSize=Math.min(25,fontSize+1);document.documentElement.style.setProperty('--font-size',fontSize+'px');};
    document.querySelector('#decrease').onclick=()=>{fontSize=Math.max(13,fontSize-1);document.documentElement.style.setProperty('--font-size',fontSize+'px');};
    document.querySelector('#copy').onclick=async()=>{if(raw)await navigator.clipboard.writeText(raw);};
    document.querySelector('#export').onclick=()=>{if(!raw)return;const page='<!doctype html><meta charset="utf-8"><title>'+escapeHtml(filename.textContent)+'</title><style>body{max-width:900px;margin:40px auto;padding:0 20px;font:17px/1.7 system-ui;color:#1d2430}pre,code{background:#f2f4f6}pre{padding:14px;overflow:auto}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:7px}img{max-width:100%}</style>'+content.innerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([page],{type:'text/html'}));a.download=filename.textContent.replace(/\.md$/i,'')+'.html';a.click();URL.revokeObjectURL(a.href);};
    ['dragenter','dragover'].forEach(e=>document.addEventListener(e,x=>{x.preventDefault();drop.classList.add('show')}));['dragleave','drop'].forEach(e=>document.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('show')}));document.addEventListener('drop',e=>openFile(e.dataTransfer.files[0]));
    document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();fileInput.click();}});
  </script>
</body>
</html>
