server {
    listen 80;
    listen [::]:80;
    server_name shiroha-rin.world;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/idea-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shiroha-rin.world;

    ssl_certificate /etc/letsencrypt/live/shiroha-rin.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiroha-rin.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IDEA_TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8900;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
