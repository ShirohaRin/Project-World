<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K.U.A.T 认证动画预览</title><style>*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI","Microsoft YaHei",sans-serif;background:#101c25;color:#d5e9e9}button{cursor:pointer;font:inherit}main{min-height:100vh;display:grid;place-content:center;text-align:center;gap:18px}main button{background:#26434b;border:1px solid #6a999a;color:#d5e9e9;padding:14px 30px;border-radius:8px}main p{color:#97b5bb}dialog{padding:28px;border-radius:14px}.terminal-auth,.terminal-portal{color:#d5e9e9;background:#111f27;border:1px solid #345059;box-shadow:0 30px 120px #091c3560;font-family:inherit}
